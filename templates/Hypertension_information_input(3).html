<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>高血压指标输入 | NutriLens</title>
    <style>
        :root {
            --primary: #165DFF;
            --text-main: #17324c;
            --text-muted: rgba(23, 50, 76, 0.72);
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-soft: rgba(255, 255, 255, 0.76);
            --border: rgba(22, 93, 255, 0.24);
            --shadow: 0 20px 48px rgba(22, 93, 255, 0.12);
            --radius: 26px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        button,
        .btn-link,
        .top-entry-link {
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        button:hover:not(:disabled),
        .btn-link:hover:not(.disabled):not([aria-disabled="true"]),
        .top-entry-link:hover {
            background-color: #165DFF;
            color: #fff;
        }

        button:active:not(:disabled),
        .btn-link:active:not(.disabled):not([aria-disabled="true"]),
        .top-entry-link:active {
            background-color: #0E42C7;
            transform: scale(0.98);
        }

        button:disabled { cursor: not-allowed; }

        html, body { min-height: 100%; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            background: linear-gradient(135deg, rgb(239, 150, 166), rgb(195, 210, 162), rgb(102, 194, 140));
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(72px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-text-size-adjust: 100%;
        }

        .top-entry-bar {
            position: fixed;
            top: calc(10px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: min(calc(100% - 32px), 720px);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            background: #FFFFFF;
            border: 1px solid #EEEEEE;
            border-radius: 22px;
            box-shadow: 0 14px 28px rgba(23, 50, 76, 0.08);
        }

        .top-entry-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 14px;
            color: #333333;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
        }

        .top-entry-link:hover {
            color: #0066CC;
            background: #F5F5F5;
        }

        .glass {
            width: min(100%, 720px);
            margin: 0 auto;
            background: linear-gradient(180deg, var(--panel-bg), var(--panel-soft));
            border: 1px solid rgba(255, 255, 255, 0.54);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            padding: 22px 16px 18px;
        }

        h1 {
            font-size: 28px;
            line-height: 1.2;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 18px;
        }

        .btn-voice,
        .btn-submit,
        .btn-back {
            width: 100%;
            min-height: 48px;
            border-radius: 16px;
            border: 2px solid var(--primary);
            background: #fff;
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-voice {
            margin-bottom: 18px;
            border-style: dashed;
        }

        .status-card,
        .hint-card,
        .section-card {
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(22, 93, 255, 0.14);
            padding: 14px;
        }

        .status-card,
        .hint-card {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .section-card + .section-card {
            margin-top: 14px;
        }

        .section-title {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .section-desc {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label,
        .group-label {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }

        .field small {
            font-size: 12px;
            color: var(--text-muted);
        }

        input[type="number"],
        select {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1.5px solid var(--border);
            background: rgba(255, 255, 255, 0.96);
            outline: none;
            font-size: 15px;
            color: var(--text-main);
        }

        input[type="number"]:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.12);
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .choice-chip {
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.84);
            border: 1.5px solid rgba(22, 93, 255, 0.14);
            cursor: pointer;
            transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease;
        }

        .choice-chip input {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            accent-color: var(--primary);
        }

        .choice-chip.selected {
            border-color: var(--primary);
            background: rgba(22, 93, 255, 0.1);
        }

        .choice-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .choice-text strong {
            font-size: 14px;
            line-height: 1.5;
        }

        .choice-text span {
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .error-text {
            margin-top: 12px;
            min-height: 20px;
            color: #d33b3b;
            font-size: 13px;
            line-height: 1.6;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        @media (min-width: 768px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: calc(88px + var(--safe-top)) 24px calc(26px + var(--safe-bottom));
            }

            .top-entry-bar {
                width: min(calc(100% - 48px), 720px);
            }

            .glass {
                padding: 30px 28px 24px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 15px;
            }

            .form-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .choice-grid.dual {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="top-entry-bar">
        <a href="{{ url_for('base_info') }}" class="top-entry-link">个人信息</a>
    </div>
    <div class="glass">
        <h1>高血压专属指标</h1>
        <p class="subtitle">本页仅填写高血压相关指标。系统会自动读取统一基础信息，并在提交后合并进入分析结果。</p>

        <button type="button" class="btn-voice" onclick="playVoice()">播放语音指引</button>

        <div class="status-card" id="baseStatus">正在读取统一基础信息...</div>

        <form id="diseaseForm" novalidate>
            <section class="section-card">
                <h2 class="section-title">血压核心指标</h2>
                <p class="section-desc">请填写最近监测或门诊记录中的关键血压指标。</p>
                <div class="form-grid">
                    <div class="field">
                        <label for="systolic_bp">收缩压（mmHg）</label>
                        <input id="systolic_bp" type="number" value="138" min="1" step="1" inputmode="decimal" enterkeyhint="next" required>
                    </div>
                    <div class="field">
                        <label for="diastolic_bp">舒张压（mmHg）</label>
                        <input id="diastolic_bp" type="number" value="88" min="1" step="1" inputmode="decimal" enterkeyhint="next" required>
                    </div>
                </div>
            </section>

            <section class="section-card">
                <h2 class="section-title">高血压分层信息</h2>
                <p class="section-desc">这些选项将直接影响钠与食盐的推荐阈值。</p>

                <div class="field">
                    <div class="group-label">高血压分级</div>
                    <div class="choice-grid">
                        <label class="choice-chip selected">
                            <input type="radio" name="bp_grade" value="grade1" checked>
                            <span class="choice-text"><strong>1 级</strong><span>一般高血压管理</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="bp_grade" value="grade2">
                            <span class="choice-text"><strong>2 级</strong><span>需要更严格控盐</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="bp_grade" value="grade3">
                            <span class="choice-text"><strong>3 级</strong><span>优先回避高钠菜品</span></span>
                        </label>
                    </div>
                </div>

                <div class="field" style="margin-top:12px;">
                    <div class="group-label">家庭血压达标</div>
                    <div class="choice-grid dual">
                        <label class="choice-chip selected">
                            <input type="radio" name="home_bp_control" value="yes" checked>
                            <span class="choice-text"><strong>已达标</strong><span>按常规阈值评估</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="home_bp_control" value="no">
                            <span class="choice-text"><strong>未达标</strong><span>系统将收紧控压上限</span></span>
                        </label>
                    </div>
                </div>

                <div class="field" style="margin-top:12px;">
                    <div class="group-label">合并疾病多选</div>
                    <div class="choice-grid dual">
                        <label class="choice-chip">
                            <input type="checkbox" name="comorbidities" value="ckd">
                            <span class="choice-text"><strong>慢性肾病</strong><span>进一步关注钠负担</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="checkbox" name="comorbidities" value="heart_failure">
                            <span class="choice-text"><strong>心力衰竭</strong><span>更严格限制高钠菜品</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="checkbox" name="comorbidities" value="diabetes">
                            <span class="choice-text"><strong>糖尿病</strong><span>同步关注控糖风险</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="checkbox" name="comorbidities" value="obesity">
                            <span class="choice-text"><strong>超重 / 肥胖</strong><span>同步关注总热量</span></span>
                        </label>
                    </div>
                </div>

                <div class="field" style="margin-top:12px;">
                    <div class="group-label">水肿 / 盐敏感情况</div>
                    <div class="choice-grid">
                        <label class="choice-chip selected">
                            <input type="radio" name="salt_sensitive" value="none" checked>
                            <span class="choice-text"><strong>无明显情况</strong><span>按常规控盐标准评估</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="salt_sensitive" value="edema">
                            <span class="choice-text"><strong>存在水肿</strong><span>系统将进一步收紧钠阈值</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="salt_sensitive" value="salt_sensitive">
                            <span class="choice-text"><strong>盐敏感</strong><span>更容易受高钠饮食影响</span></span>
                        </label>
                    </div>
                </div>
            </section>

            <div class="hint-card">如需修改年龄、体重、eGFR 或健康状况，请返回统一基础信息页重新提交。</div>
            <div class="error-text" id="errorText"></div>

            <div class="action-row">
                <button type="button" class="btn-back" onclick="goBack()">返回</button>
                <button type="button" class="btn-submit" id="submitBtn" onclick="submitForm()">进入系统</button>
            </div>
        </form>
    </div>

    <script>
        const STORAGE_KEY = "nutrilens.hypertension.form";
        const DETAIL_KEY = "hypertension_detail";
        const RESULT_PAGE = "{{ url_for('hypertension_analyse') }}";
        const DISEASE_VALUE = "hypertension";
        const DISEASE_LABEL = "高血压";

        const form = document.getElementById("diseaseForm");
        const errorText = document.getElementById("errorText");
        const submitBtn = document.getElementById("submitBtn");
        const baseStatus = document.getElementById("baseStatus");

        function pickChineseVoice() {
            const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            return voices.find((voice) =>
                /zh|chinese|xiaoxiao|xiaoyi|tingting|female/i.test((voice.lang || "") + " " + (voice.name || ""))
            ) || voices.find((voice) => /zh/i.test(voice.lang || "")) || null;
        }

        function speak(text) {
            if (!("speechSynthesis" in window) || !text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "zh-CN";
            utterance.rate = 0.9;
            const voice = pickChineseVoice();
            if (voice) utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
        }

        function playVoice() {
            speak("请填写收缩压、舒张压、高血压分级、家庭血压达标情况、合并疾病以及水肿或盐敏感情况。");
        }

        function updateChoiceStates() {
            document.querySelectorAll(".choice-chip").forEach((chip) => {
                const input = chip.querySelector("input");
                chip.classList.toggle("selected", !!input.checked);
            });
        }

        function setupEnterJump() {
            const inputs = Array.from(form.querySelectorAll('input[type="number"], select')).filter((item) => !item.disabled);
            inputs.forEach((input, index) => {
                input.addEventListener("keydown", (event) => {
                    if (event.key !== "Enter") return;
                    event.preventDefault();
                    const next = inputs[index + 1];
                    if (next) {
                        next.focus();
                    } else {
                        submitForm();
                    }
                });
            });
        }

        function collectValues(name) {
            return Array.from(form.querySelectorAll(`input[name="${name}"]:checked`)).map((input) => input.value);
        }

        function readBaseInfo() {
            try {
                return JSON.parse(localStorage.getItem("nutrilens.base.info") || "{}");
            } catch (error) {
                return {};
            }
        }

        function uniqueValues(values) {
            return Array.from(new Set((values || []).filter(Boolean)));
        }

        function renderBaseStatus() {
            const baseInfo = readBaseInfo();
            const basic = baseInfo.basic || {};
            const other = baseInfo.other || {};
            if (basic.age) {
                const conditions = Array.isArray(baseInfo.conditions) && baseInfo.conditions.length
                    ? `已配置 ${baseInfo.conditions.length} 项健康状况`
                    : "暂未额外勾选健康状况";
                baseStatus.textContent = `已读取基础信息：${basic.age} 岁，${basic.gender === "female" ? "女性" : "男性"}，活动强度 ${basic.activity || "未填写"}，eGFR ${other.egfr || "--"}。${conditions}。`;
            } else {
                baseStatus.textContent = "未读取到统一基础信息。请先返回填写基础信息，再进入当前病种指标页。";
            }
        }

        function validateForm() {
            errorText.textContent = "";
            const systolic = Number(document.getElementById("systolic_bp").value);
            const diastolic = Number(document.getElementById("diastolic_bp").value);
            if (!systolic || systolic <= 0) {
                errorText.textContent = "请填写有效的收缩压。";
                document.getElementById("systolic_bp").focus();
                return false;
            }
            if (!diastolic || diastolic <= 0) {
                errorText.textContent = "请填写有效的舒张压。";
                document.getElementById("diastolic_bp").focus();
                return false;
            }
            const baseInfo = readBaseInfo();
            if (!baseInfo.basic || !baseInfo.basic.age) {
                errorText.textContent = "未找到统一基础信息，请先返回基础信息页完成提交。";
                return false;
            }
            return true;
        }

        function buildPayload() {
            const baseInfo = readBaseInfo();
            const conditions = uniqueValues([...(baseInfo.conditions || []), DISEASE_VALUE]);
            return {
                disease: DISEASE_VALUE,
                basic: baseInfo.basic || {},
                conditions,
                other: baseInfo.other || {},
                [DETAIL_KEY]: {
                    systolic_bp: Number(document.getElementById("systolic_bp").value),
                    diastolic_bp: Number(document.getElementById("diastolic_bp").value),
                    bp_grade: form.querySelector('input[name="bp_grade"]:checked').value,
                    home_bp_control: form.querySelector('input[name="home_bp_control"]:checked').value,
                    comorbidities: collectValues("comorbidities"),
                    salt_sensitive: form.querySelector('input[name="salt_sensitive"]:checked').value
                }
            };
        }

        function fillChoiceGroup(name, values) {
            const selectedValues = Array.isArray(values) ? values : [values];
            form.querySelectorAll(`input[name="${name}"]`).forEach((input) => {
                input.checked = selectedValues.includes(input.value);
            });
        }

        function hydrateExisting() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                const detail = saved[DETAIL_KEY] || {};
                if (detail.systolic_bp) document.getElementById("systolic_bp").value = detail.systolic_bp;
                if (detail.diastolic_bp) document.getElementById("diastolic_bp").value = detail.diastolic_bp;
                if (detail.bp_grade) fillChoiceGroup("bp_grade", detail.bp_grade);
                if (detail.home_bp_control) fillChoiceGroup("home_bp_control", detail.home_bp_control);
                fillChoiceGroup("comorbidities", detail.comorbidities || []);
                if (detail.salt_sensitive) fillChoiceGroup("salt_sensitive", detail.salt_sensitive);
            } catch (error) {
                console.warn("hypertension hydrate failed", error);
            }
        }

        function submitForm() {
            if (!validateForm()) return;
            const payload = buildPayload();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            localStorage.setItem("nutrilens.latest.form", JSON.stringify(payload));
            submitBtn.disabled = true;
            submitBtn.textContent = "正在进入...";
            speak("高血压指标已保存，正在进入检测分析页。");
            setTimeout(() => {
                window.location.href = RESULT_PAGE;
            }, 900);
        }

        function goBack() {
            speak("返回健康管理类别选择页。");
            setTimeout(() => {
                window.location.href = "{{ url_for('dcsi_main') }}";
            }, 420);
        }

        form.addEventListener("change", updateChoiceStates);

        window.onload = function () {
            hydrateExisting();
            renderBaseStatus();
            updateChoiceStates();
            setupEnterJump();
            playVoice();
        };
    </script>
</body>
</html>
