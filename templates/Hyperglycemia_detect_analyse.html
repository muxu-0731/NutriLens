<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 高血糖饮食识别终端</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --primary: #165DFF;
            --accent: #FFC107;
            --safe: #27AE60;
            --caution: #FFC107;
            --avoid: #E74C3C;
            --text-main: #333333;
            --text-muted: #666666;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --border: rgba(22, 93, 255, 0.3);
            --font-main: "微软雅黑", "PingFang SC", system-ui, sans-serif;
            --clover: rgba(129, 199, 132, 0.25);
            --pink: #FF69B4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, rgb(239, 150, 166) 0%, rgb(195, 210, 162) 50%, rgb(102, 194, 140) 100%);
            color: var(--text-main);
            font-size: 18px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .app-container {
            width: 98%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 10;
        }

        @media (min-width: 1024px) {
            .app-container {
                flex-direction: row;
            }

            .side-left {
                flex: 1.5;
            }

            .side-right {
                flex: 1;
            }
        }

        .glass {
            background: var(--panel-bg);
            border: 2px solid var(--border);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(22, 93, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
        }

        .side-left {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .viewport {
            flex: 1;
            position: relative;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid var(--border);
            overflow: hidden;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(22, 93, 255, 0.1) 1px, transparent 0);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 2;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--primary), transparent);
            box-shadow: 0 0 20px var(--accent);
            opacity: 0;
            z-index: 10;
        }

        .scanning .scan-line {
            animation: scan-anim 3s infinite ease-in-out;
            opacity: 1;
        }

        @keyframes scan-anim {
            0% {
                top: 0%;
            }

            100% {
                top: 100%;
            }
        }

        .side-right {
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .metric-card {
            background: #fff;
            border: 2px solid var(--border);
            padding: 20px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

            .metric-card:hover {
                background: #f0f7ff;
                box-shadow: 0 8px 20px rgba(22, 93, 255, 0.15);
            }

            .metric-card > div:first-child {
                font-size: 20px;
                color: var(--text-muted);
                margin-bottom: 5px;
                font-weight: 600;
            }

            .metric-card > div:last-child {
                font-size: 28px;
                font-weight: 700;
                color: var(--primary);
            }

        /* 推荐食用量粉色样式 */
        .weight-card {
            padding: 15px 20px;
            flex-shrink: 0;
        }

            .weight-card > div:last-child {
                color: var(--pink) !important;
            }

        /* 双栏分隔卡片样式 */
        .split-card {
            display: flex;
            padding: 0 !important;
            overflow: hidden;
        }

        .split-item {
            flex: 1;
            padding: 20px;
            text-align: center;
        }

            .split-item:first-child {
                border-right: 2px solid var(--border);
            }
            /* 标题灰色 数值蓝色 */
            .split-item div:first-child {
                font-size: 20px;
                color: var(--text-muted) !important;
                font-weight: 600;
                margin-bottom: 5px;
            }

            .split-item div:last-child {
                font-size: 28px;
                font-weight: 700;
                color: var(--primary) !important;
            }

        .ai-log {
            padding: 20px;
            border-radius: 20px;
            background: rgba(22, 93, 255, 0.05);
            border: 2px solid var(--border);
            line-height: 1.6;
        }

            .ai-log > div:first-child {
                color: var(--primary);
                font-size: 20px;
                font-weight: 700;
                margin-bottom: 8px;
            }

            .ai-log > div:last-child {
                font-size: 20px;
                opacity: 0.9;
            }

        .btn-main {
            padding: 22px 45px;
            font-size: 24px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3;
            letter-spacing: 1px;
            border: none;
            flex: 1;
        }

        .btn-back-main, #btn-scan, .btn-reset {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: 0 8px 20px rgba(22, 93, 255, 0.1);
        }

            .btn-back-main:hover, #btn-scan:hover, .btn-reset:hover {
                background: var(--primary);
                color: #fff;
                transform: translateY(-2px);
            }

        .btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        /* 核心布局：标题区域左右分栏 */
        .food-title-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        /* 左侧：食物名称 + 风险评估（垂直排列） */
        .food-info-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* 食物名称样式 */
        #f-name {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
        }
        /* 风险标签样式 */
        #f-badge {
            display: inline-block;
            padding: 8px 16px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 10px;
            display: none;
        }

        .SAFE {
            color: var(--safe) !important;
        }

        .CAUTION {
            color: var(--caution) !important;
        }

        .AVOID {
            color: var(--avoid) !important;
        }

        .status-bar {
            padding: 18px 25px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="app-container" id="app-terminal">
        <div class="side-left">
            <div class="glass status-bar">
                <span>📡 AI高血糖饮食识别终端：已就绪</span>
                <span>状态：正常</span>
            </div>

            <div class="glass viewport" id="view-box">
                <div class="grid-overlay"></div>
                <div class="scan-line"></div>
                <!-- ✅ 新增：摄像头预览图片（z-index=1，在网格线下面） -->
                <img id="camera-preview" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; display:none;" alt="摄像头预览">
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:60px; height:60px; border:3px solid var(--primary); opacity:0.5; border-radius:50%; z-index:3;"></div>
            </div>

            <div class="btn-group">
                <button class="btn-main btn-back-main" onclick="goBackToConfig()">返回</button>
                <button class="btn-main btn-reset" onclick="resetUI()">重置系统</button>
                <button class="btn-main" id="btn-scan" onclick="processVision()">执行扫描</button>
            </div>
        </div>

        <div class="side-right glass">
            <!-- 核心布局容器：左右结构 -->
            <div class="food-title-wrapper">
                <!-- 左侧：食物名称 + 风险评估（垂直排列） -->
                <div class="food-info-left">
                    <h1 id="f-name">等待扫描...</h1>
                    <div id="f-badge" class="CAUTION">风险评估: 中等风险</div>
                </div>
                <!-- 右侧：推荐食用量（垂直居中） -->
                <div class="metric-card weight-card">
                    <div>推荐使用量</div>
                    <div id="f-weight">--</div>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 15px;">
                <!-- 竖线分隔双栏卡片 -->
                <div class="metric-card split-card">
                    <div class="split-item">
                        <div>血糖生成指数</div>
                        <div id="f-gi">--</div>
                    </div>
                    <div class="split-item">
                        <div>血糖负荷</div>
                        <div id="f-gl">--</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div>净碳水化合物</div>
                    <div id="f-carbs">--</div>
                </div>
            </div>

            <!-- 修复：AI饮食分析建议模块 -->
            <div class="ai-log">
                <div>AI饮食分析建议</div>
                <div id="f-advice">
                    请点击「执行扫描」按钮，系统将识别食物并给出饮食建议。
                </div>
            </div>
        </div>
    </div>

    <script>
        let isSpeaking = false;

        function autoSpeak(text) {
            window.speechSynthesis.cancel();
            const voice = new SpeechSynthesisUtterance();
            voice.text = text;
            voice.lang = "zh-CN";
            voice.volume = 1;
            voice.rate = 0.9;
            window.speechSynthesis.speak(voice);
        }

        async function processVision() {
            const box = document.getElementById('view-box');
            const btn = document.getElementById('btn-scan');

            box.classList.add('scanning');
            btn.innerText = "正在扫描...";
            btn.disabled = true;
            window.speechSynthesis.cancel();

            try {
                // ✅ 1. 加上病种参数：hyperglycemia
                const response = await fetch('/detect?disease=hyperglycemia');
                const data = await response.json();

                const preview = document.getElementById('camera-preview');
                preview.src = `data:image/jpeg;base64,${data.imgBase64}`;
                preview.style.display = 'block';

                document.getElementById('f-name').innerText = data.food;
                document.getElementById('f-weight').innerText = data.portion;
                document.getElementById('f-gi').innerText = data.gi;
                document.getElementById('f-gl').innerText = data.gl;
                document.getElementById('f-carbs').innerText = `${data.net_carbs}g`;

                const badge = document.getElementById('f-badge');
                badge.style.display = 'inline-block';
                if (data.level === "SAFE") {
                    badge.className = "SAFE";
                    badge.innerText = "风险评估: 安全";
                } else if (data.level === "CAUTION") {
                    badge.className = "CAUTION";
                    badge.innerText = "风险评估: 中等风险";
                } else if (data.level === "AVOID") {
                    badge.className = "AVOID";
                    badge.innerText = "风险评估: 避免食用";
                } else if (data.level === "ERROR") {
                    badge.className = "AVOID";
                    badge.innerText = "系统错误";
                } else if (data.level === "NONE") {
                    badge.style.display = 'none';
                } else {
                    badge.className = "CAUTION";
                    badge.innerText = "风险评估: 未知";
                }

                // ✅ 2. 改成显示 JSON 里的 tip
                document.getElementById('f-advice').innerText =
                    data.level === "NONE" ? "请将摄像头对准菜品，确保菜品在画面中央。" :
                        data.level === "ERROR" ? "摄像头连接失败，请检查硬件连接。" :
                            data.tip;

                if (data.level !== "NONE" && data.level !== "ERROR") {
                    autoSpeak(`扫描完成！识别到食物是${data.food}，${data.portion}`);
                } else if (data.level === "NONE") {
                    autoSpeak("未检测到食物，请重新对准菜品。");
                } else {
                    autoSpeak("摄像头错误，请检查硬件连接。");
                }

            } catch (error) {
                console.error("识别错误:", error);
                document.getElementById('f-name').innerText = "识别失败";
                document.getElementById('f-weight').innerText = "--";
                document.getElementById('f-gi').innerText = "--";
                document.getElementById('f-gl').innerText = "--";
                document.getElementById('f-carbs').innerText = "--";
                document.getElementById('f-badge').style.display = 'none';
                document.getElementById('f-advice').innerText = "网络连接失败，请检查服务器是否正常运行。";
                autoSpeak("识别失败，请检查网络连接。");
            }

            box.classList.remove('scanning');
            btn.innerText = "重新扫描";
            btn.disabled = false;
        }

        function resetUI() {
            window.speechSynthesis.cancel();
            document.getElementById('f-name').innerText = "等待扫描...";
            document.getElementById('f-weight').innerText = "--";
            // 重置双栏数值
            document.getElementById('f-gi').innerText = "--";
            document.getElementById('f-gl').innerText = "--";
            document.getElementById('f-carbs').innerText = "--";
            document.getElementById('f-badge').style.display = 'none';
            document.getElementById('f-advice').innerText = "系统已重置，请点击「执行扫描」按钮开始新的识别。";

            // ✅ 新增：重置时清空摄像头预览图片
            const preview = document.getElementById('camera-preview');
            preview.src = '';
            preview.style.display = 'none';

            autoSpeak("系统已重置，等待您再次扫描食物。");
        }

        function goBackToConfig() {
            autoSpeak("返回个人健康配置页面");
            setTimeout(() => window.location.href = "/Hyperglycemia_information_input", 800);
        }

        window.onload = () => {
            autoSpeak("欢迎使用AI高血糖饮食识别终端，请点击执行扫描按钮开始识别食物。");
        };
    </script>
</body>
</html>
