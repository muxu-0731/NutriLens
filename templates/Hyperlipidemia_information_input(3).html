<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>高血脂指标输入 | NutriLens</title>
    <style>
        :root {
            --primary: #165DFF;
            --text-main: #17324c;
            --text-muted: rgba(23, 50, 76, 0.72);
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-soft: rgba(255, 255, 255, 0.76);
            --border: rgba(22, 93, 255, 0.24);
            --shadow: 0 20px 48px rgba(22, 93, 255, 0.12);
            --radius: 26px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        button, .btn-link, .top-entry-link { transition: all 0.2s ease; touch-action: manipulation; }
        button:hover:not(:disabled), .btn-link:hover:not(.disabled):not([aria-disabled="true"]), .top-entry-link:hover { background-color: #165DFF; color: #fff; }
        button:active:not(:disabled), .btn-link:active:not(.disabled):not([aria-disabled="true"]), .top-entry-link:active { background-color: #0E42C7; transform: scale(0.98); }
        button:disabled { cursor: not-allowed; }
        html, body { min-height: 100%; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            background: linear-gradient(135deg, rgb(239, 150, 166), rgb(195, 210, 162), rgb(102, 194, 140));
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(72px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
            overflow-x: hidden;
            overflow-y: auto;
        }

        .top-entry-bar {
            position: fixed;
            top: calc(10px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: min(calc(100% - 32px), 720px);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            background: #FFFFFF;
            border: 1px solid #EEEEEE;
            border-radius: 22px;
            box-shadow: 0 14px 28px rgba(23, 50, 76, 0.08);
        }

        .top-entry-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 14px;
            color: #333333;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
        }

        .top-entry-link:hover {
            color: #0066CC;
            background: #F5F5F5;
        }

        .glass {
            width: min(100%, 720px);
            margin: 0 auto;
            background: linear-gradient(180deg, var(--panel-bg), var(--panel-soft));
            border: 1px solid rgba(255, 255, 255, 0.54);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            padding: 22px 16px 18px;
        }

        h1 { font-size: 28px; line-height: 1.2; color: var(--primary); text-align: center; margin-bottom: 8px; }
        .subtitle { font-size: 14px; line-height: 1.7; color: var(--text-muted); text-align: center; margin-bottom: 18px; }
        .btn-voice, .btn-submit, .btn-back { width: 100%; min-height: 48px; border-radius: 16px; border: 2px solid var(--primary); background: #fff; color: var(--primary); font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-voice { margin-bottom: 18px; border-style: dashed; }
        .status-card, .hint-card, .section-card { border-radius: 18px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(22, 93, 255, 0.14); padding: 14px; }
        .status-card, .hint-card { font-size: 13px; line-height: 1.7; color: var(--text-muted); margin-bottom: 14px; }
        .section-card + .section-card { margin-top: 14px; }
        .section-title { font-size: 18px; color: var(--primary); margin-bottom: 8px; }
        .section-desc { font-size: 13px; line-height: 1.6; color: var(--text-muted); margin-bottom: 12px; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label, .group-label { font-size: 15px; font-weight: 700; color: var(--primary); }
        .field small { font-size: 12px; color: var(--text-muted); }
        input[type="number"], select { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--border); background: rgba(255, 255, 255, 0.96); outline: none; font-size: 15px; color: var(--text-main); }
        input[type="number"]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.12); }
        .choice-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .choice-chip { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.84); border: 1.5px solid rgba(22, 93, 255, 0.14); cursor: pointer; transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease; }
        .choice-chip input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--primary); }
        .choice-chip.selected { border-color: var(--primary); background: rgba(22, 93, 255, 0.1); }
        .choice-text { display: flex; flex-direction: column; gap: 2px; }
        .choice-text strong { font-size: 14px; line-height: 1.5; }
        .choice-text span { font-size: 12px; line-height: 1.5; color: var(--text-muted); }
        .error-text { margin-top: 12px; min-height: 20px; color: #d33b3b; font-size: 13px; line-height: 1.6; }
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }

        @media (min-width: 768px) {
            body { display: flex; align-items: center; justify-content: center; padding: calc(88px + var(--safe-top)) 24px calc(26px + var(--safe-bottom)); }
            .top-entry-bar { width: min(calc(100% - 48px), 720px); }
            .glass { padding: 30px 28px 24px; }
            h1 { font-size: 32px; }
            .subtitle { font-size: 15px; }
            .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
            .choice-grid.dual { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="top-entry-bar">
        <a href="{{ url_for('base_info') }}" class="top-entry-link">个人信息</a>
    </div>
    <div class="glass">
        <h1>高血脂专属指标</h1>
        <p class="subtitle">本页仅保留高血脂相关指标。系统会自动合并统一基础信息后进入检测分析页。</p>

        <button type="button" class="btn-voice" onclick="playVoice()">播放语音指引</button>
        <div class="status-card" id="baseStatus">正在读取统一基础信息...</div>

        <form id="diseaseForm" novalidate>
            <section class="section-card">
                <h2 class="section-title">血脂核心指标</h2>
                <p class="section-desc">请优先填写最近一次化验单中的 LDL-C、TG 与 HDL-C。</p>
                <div class="form-grid">
                    <div class="field">
                        <label for="ldl_c">LDL-C（mmol/L）</label>
                        <input id="ldl_c" type="number" value="3.6" min="0" step="0.1" inputmode="decimal" enterkeyhint="next" required>
                    </div>
                    <div class="field">
                        <label for="tg">TG（mmol/L）</label>
                        <input id="tg" type="number" value="2.1" min="0" step="0.1" inputmode="decimal" enterkeyhint="next" required>
                    </div>
                    <div class="field">
                        <label for="hdl_c">HDL-C（mmol/L）</label>
                        <input id="hdl_c" type="number" value="1.0" min="0" step="0.1" inputmode="decimal" enterkeyhint="next" required>
                    </div>
                </div>
            </section>

            <section class="section-card">
                <h2 class="section-title">高血脂风险修正项</h2>
                <p class="section-desc">这些信息会共同影响脂肪、饱和脂肪与胆固醇的推荐上限。</p>

                <div class="field">
                    <div class="group-label">ASCVD 病史</div>
                    <div class="choice-grid dual">
                        <label class="choice-chip selected">
                            <input type="radio" name="ascvd_history" value="no" checked>
                            <span class="choice-text"><strong>无</strong><span>按常规血脂风险评估</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="ascvd_history" value="yes">
                            <span class="choice-text"><strong>有</strong><span>系统将显著收紧胆固醇阈值</span></span>
                        </label>
                    </div>
                </div>

                <div class="field" style="margin-top:12px;">
                    <div class="group-label">脂肪肝类型</div>
                    <div class="choice-grid">
                        <label class="choice-chip selected">
                            <input type="radio" name="fatty_liver_type" value="none" checked>
                            <span class="choice-text"><strong>无脂肪肝</strong><span>按常规脂肪总量评估</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="fatty_liver_type" value="mild">
                            <span class="choice-text"><strong>轻度脂肪肝</strong><span>适度收紧脂肪上限</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="fatty_liver_type" value="moderate_severe">
                            <span class="choice-text"><strong>中重度脂肪肝</strong><span>优先控制脂肪与总热量</span></span>
                        </label>
                    </div>
                </div>

                <div class="field" style="margin-top:12px;">
                    <div class="group-label">是否使用降脂药</div>
                    <div class="choice-grid dual">
                        <label class="choice-chip selected">
                            <input type="radio" name="lipid_drug" value="no" checked>
                            <span class="choice-text"><strong>未使用</strong><span>按基础阈值评估</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="lipid_drug" value="statin">
                            <span class="choice-text"><strong>他汀类</strong><span>系统将同步收紧胆固醇管理</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="lipid_drug" value="fibrate">
                            <span class="choice-text"><strong>贝特类</strong><span>重点参考甘油三酯风险</span></span>
                        </label>
                        <label class="choice-chip">
                            <input type="radio" name="lipid_drug" value="other">
                            <span class="choice-text"><strong>其他方案</strong><span>保守收紧相关阈值</span></span>
                        </label>
                    </div>
                </div>
            </section>

            <div class="hint-card">如需修改年龄、体重、eGFR 或多病共存情况，请返回统一基础信息页重新提交。</div>
            <div class="error-text" id="errorText"></div>
            <div class="action-row">
                <button type="button" class="btn-back" onclick="goBack()">返回</button>
                <button type="button" class="btn-submit" id="submitBtn" onclick="submitForm()">进入系统</button>
            </div>
        </form>
    </div>

    <script>
        const STORAGE_KEY = "nutrilens.hyperlipidemia.form";
        const DETAIL_KEY = "hyperlipidemia_detail";
        const RESULT_PAGE = "{{ url_for('hyperlipidemia_analyse') }}";
        const DISEASE_VALUE = "hyperlipidemia";

        const form = document.getElementById("diseaseForm");
        const errorText = document.getElementById("errorText");
        const submitBtn = document.getElementById("submitBtn");
        const baseStatus = document.getElementById("baseStatus");

        function pickChineseVoice() {
            const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            return voices.find((voice) =>
                /zh|chinese|xiaoxiao|xiaoyi|tingting|female/i.test((voice.lang || "") + " " + (voice.name || ""))
            ) || voices.find((voice) => /zh/i.test(voice.lang || "")) || null;
        }

        function speak(text) {
            if (!("speechSynthesis" in window) || !text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "zh-CN";
            utterance.rate = 0.9;
            const voice = pickChineseVoice();
            if (voice) utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
        }

        function playVoice() {
            speak("请填写低密度脂蛋白、甘油三酯、高密度脂蛋白、ASCVD 病史、脂肪肝类型以及是否使用降脂药。");
        }

        function updateChoiceStates() {
            document.querySelectorAll(".choice-chip").forEach((chip) => {
                const input = chip.querySelector("input");
                chip.classList.toggle("selected", !!input.checked);
            });
        }

        function setupEnterJump() {
            const inputs = Array.from(form.querySelectorAll('input[type="number"], select')).filter((item) => !item.disabled);
            inputs.forEach((input, index) => {
                input.addEventListener("keydown", (event) => {
                    if (event.key !== "Enter") return;
                    event.preventDefault();
                    const next = inputs[index + 1];
                    if (next) next.focus();
                    else submitForm();
                });
            });
        }

        function collectValues(name) {
            return Array.from(form.querySelectorAll(`input[name="${name}"]:checked`)).map((input) => input.value);
        }

        function readBaseInfo() {
            try { return JSON.parse(localStorage.getItem("nutrilens.base.info") || "{}"); }
            catch (error) { return {}; }
        }

        function uniqueValues(values) {
            return Array.from(new Set((values || []).filter(Boolean)));
        }

        function renderBaseStatus() {
            const baseInfo = readBaseInfo();
            const basic = baseInfo.basic || {};
            const other = baseInfo.other || {};
            if (basic.age) {
                const conditions = Array.isArray(baseInfo.conditions) && baseInfo.conditions.length
                    ? `已配置 ${baseInfo.conditions.length} 项健康状况`
                    : "暂未额外勾选健康状况";
                baseStatus.textContent = `已读取基础信息：${basic.age} 岁，${basic.gender === "female" ? "女性" : "男性"}，活动强度 ${basic.activity || "未填写"}，eGFR ${other.egfr || "--"}。${conditions}。`;
            } else {
                baseStatus.textContent = "未读取到统一基础信息。请先返回填写基础信息，再进入当前病种指标页。";
            }
        }

        function validateForm() {
            errorText.textContent = "";
            const requiredIds = ["ldl_c", "tg", "hdl_c"];
            for (const id of requiredIds) {
                const input = document.getElementById(id);
                if (input.value === "" || Number(input.value) < 0) {
                    errorText.textContent = "请完整填写血脂核心指标。";
                    input.focus();
                    return false;
                }
            }
            const baseInfo = readBaseInfo();
            if (!baseInfo.basic || !baseInfo.basic.age) {
                errorText.textContent = "未找到统一基础信息，请先返回基础信息页完成提交。";
                return false;
            }
            return true;
        }

        function buildPayload() {
            const baseInfo = readBaseInfo();
            const conditions = uniqueValues([...(baseInfo.conditions || []), DISEASE_VALUE]);
            return {
                disease: DISEASE_VALUE,
                basic: baseInfo.basic || {},
                conditions,
                other: baseInfo.other || {},
                [DETAIL_KEY]: {
                    ldl_c: Number(document.getElementById("ldl_c").value),
                    tg: Number(document.getElementById("tg").value),
                    hdl_c: Number(document.getElementById("hdl_c").value),
                    ascvd_history: form.querySelector('input[name="ascvd_history"]:checked').value,
                    fatty_liver_type: form.querySelector('input[name="fatty_liver_type"]:checked').value,
                    lipid_drug: form.querySelector('input[name="lipid_drug"]:checked').value
                }
            };
        }

        function fillChoiceGroup(name, values) {
            const selectedValues = Array.isArray(values) ? values : [values];
            form.querySelectorAll(`input[name="${name}"]`).forEach((input) => {
                input.checked = selectedValues.includes(input.value);
            });
        }

        function hydrateExisting() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                const detail = saved[DETAIL_KEY] || {};
                if (detail.ldl_c !== undefined) document.getElementById("ldl_c").value = detail.ldl_c;
                if (detail.tg !== undefined) document.getElementById("tg").value = detail.tg;
                if (detail.hdl_c !== undefined) document.getElementById("hdl_c").value = detail.hdl_c;
                if (detail.ascvd_history) fillChoiceGroup("ascvd_history", detail.ascvd_history);
                if (detail.fatty_liver_type) fillChoiceGroup("fatty_liver_type", detail.fatty_liver_type);
                if (detail.lipid_drug) fillChoiceGroup("lipid_drug", detail.lipid_drug);
            } catch (error) {
                console.warn("hyperlipidemia hydrate failed", error);
            }
        }

        function submitForm() {
            if (!validateForm()) return;
            const payload = buildPayload();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            localStorage.setItem("nutrilens.latest.form", JSON.stringify(payload));
            submitBtn.disabled = true;
            submitBtn.textContent = "正在进入...";
            speak("高血脂指标已保存，正在进入检测分析页。");
            setTimeout(() => {
                window.location.href = RESULT_PAGE;
            }, 900);
        }

        function goBack() {
            speak("返回健康管理类别选择页。");
            setTimeout(() => {
                window.location.href = "{{ url_for('dcsi_main') }}";
            }, 420);
        }

        form.addEventListener("change", updateChoiceStates);

        window.onload = function () {
            hydrateExisting();
            renderBaseStatus();
            updateChoiceStates();
            setupEnterJump();
            playVoice();
        };
    </script>
</body>
</html>
