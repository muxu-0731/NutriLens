<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NutriLens 启动页</title>
    <style>
        :root {
            --primary: #165DFF;
            --primary-deep: #0f46bf;
            --text-main: #14324c;
            --text-soft: rgba(20, 50, 76, 0.74);
            --glass-bg: rgba(255, 255, 255, 0.24);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 24px 60px rgba(20, 50, 76, 0.16);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        button,
        .btn-link,
        .logo-link {
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        button:hover:not(:disabled),
        .btn-link:hover:not(.disabled):not([aria-disabled="true"]) {
            background-color: #165DFF;
            color: #fff;
        }

        button:active:not(:disabled),
        .btn-link:active:not(.disabled):not([aria-disabled="true"]),
        .logo-link:active {
            background-color: #0E42C7;
            transform: scale(0.98);
        }

        button:disabled {
            cursor: not-allowed;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.42), transparent 28%),
                radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.26), transparent 24%),
                linear-gradient(135deg, rgb(239, 150, 166), rgb(195, 210, 162), rgb(102, 194, 140));
            color: var(--text-main);
            overflow: hidden;
        }

        .shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: calc(20px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));
        }

        .hero {
            position: relative;
            width: min(100%, 460px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .halo {
            position: absolute;
            inset: 10% 10%;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.36), transparent 72%);
            filter: blur(20px);
            animation: haloPulse 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        .logo-link {
            display: block;
            width: 100%;
            min-height: 48px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-frame {
            position: relative;
            padding: 16px;
            border-radius: 34px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), var(--glass-bg));
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .logo-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 18%, rgba(255, 255, 255, 0.58) 48%, transparent 78%);
            transform: translateX(-135%);
            animation: edgeFlash 2.4s linear infinite;
        }

        .logo-img {
            position: relative;
            display: block;
            width: clamp(240px, 76vw, 360px);
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 16px 28px rgba(20, 50, 76, 0.2));
        }

        .headline {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .headline h1 {
            font-size: clamp(28px, 7vw, 42px);
            line-height: 1.1;
            letter-spacing: 0.04em;
        }

        .hint {
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.36);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-soft);
            text-align: center;
        }

        .loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(9, 34, 58, 0.34);
            backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.24s ease, visibility 0.24s ease;
        }

        .loading.show {
            opacity: 1;
            visibility: visible;
        }

        .loading-card {
            width: min(100%, 320px);
            padding: 26px 22px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .spinner {
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            border-radius: 50%;
            border: 4px solid rgba(22, 93, 255, 0.14);
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        .loading-card strong {
            display: block;
            font-size: 19px;
            margin-bottom: 8px;
        }

        .loading-card span {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-soft);
        }

        @keyframes edgeFlash {
            100% {
                transform: translateX(135%);
            }
        }

        @keyframes haloPulse {
            0%,
            100% {
                opacity: 0.76;
                transform: scale(0.98);
            }
            50% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (min-width: 768px) {
            .shell {
                padding: calc(28px + var(--safe-top)) 24px calc(30px + var(--safe-bottom));
            }

            .hero {
                gap: 22px;
            }

            .logo-frame {
                padding: 22px;
                border-radius: 38px;
            }

            .logo-img {
                width: min(64vw, 380px);
            }

            .hint {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="hero">
            <div class="halo"></div>
            <a href="{{ url_for('dcsi_main') }}" class="logo-link" id="logoLink" aria-label="进入 NutriLens 健康管理系统">
                <div class="logo-frame">
                    <img src="{{ url_for('static', filename='logo.png') }}" class="logo-img" alt="NutriLens Logo">
                </div>
            </a>
            <div class="headline">
                <h1>NutriLens</h1>
            </div>
            <div class="hint">点击系统 Logo，进入健康管理类别选择</div>
        </section>
    </main>

    <div class="loading" id="loadingMask" aria-hidden="true">
        <div class="loading-card">
            <div class="spinner"></div>
            <strong>正在进入 NutriLens</strong>
            <span>正在加载健康管理类别选择页，请稍候。</span>
        </div>
    </div>

    <script>
        const logoLink = document.getElementById("logoLink");
        const loadingMask = document.getElementById("loadingMask");
        let isNavigating = false;

        function pickChineseVoice() {
            const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            return voices.find((voice) =>
                /zh|chinese|xiaoxiao|xiaoyi|tingting|female/i.test((voice.lang || "") + " " + (voice.name || ""))
            ) || voices.find((voice) => /zh/i.test(voice.lang || "")) || null;
        }

        function speak(text) {
            if (!("speechSynthesis" in window) || !text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "zh-CN";
            utterance.rate = 0.9;
            const voice = pickChineseVoice();
            if (voice) utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
        }

        logoLink.addEventListener("click", function (event) {
            if (isNavigating) {
                event.preventDefault();
                return;
            }
            event.preventDefault();
            isNavigating = true;
            loadingMask.classList.add("show");
            loadingMask.setAttribute("aria-hidden", "false");
            speak("正在进入健康管理类别选择页。");
            setTimeout(function () {
                window.location.href = "{{ url_for('dcsi_main') }}";
            }, 780);
        });

        window.addEventListener("load", function () {
            speak("欢迎使用 NutriLens 膳食识别终端。点击系统标志，进入健康管理类别选择页。");
        });
    </script>
</body>
</html>
