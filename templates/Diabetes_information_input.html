<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人健康配置 | AI饮食终端</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --primary: #165DFF;
            --accent: #FFC107;
            --text-main: #333333;
            --text-muted: #666666;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --border: rgba(22, 93, 255, 0.3);
            --font-main: "微软雅黑", "PingFang SC", system-ui, sans-serif;
            --clover: rgba(129, 199, 132, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, rgb(239, 150, 166) 0%, rgb(195, 210, 162) 50%, rgb(102, 194, 140) 100%);
            color: var(--text-main);
            font-size: 18px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        .glass {
            background: var(--panel-bg);
            border: 2px solid var(--border);
            border-radius: 28px;
            backdrop-filter: blur(10px);
            padding: 60px 45px;
            width: 90%; max-width: 500px;
            box-shadow: 0 10px 30px rgba(22, 93, 255, 0.1);
            z-index: 10;
            position: relative;
        }
        h1 { font-size: 32px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 10px; }
        .subtitle { font-size: 16px; color: var(--text-muted); text-align: center; margin-bottom: 40px; }
        .form-group { margin-bottom: 35px; }
        label { display: block; font-size: 20px; font-weight: 600; color: var(--primary); margin-bottom: 12px; }
        input { width: 100%; padding: 20px 25px; font-size: 22px; background: #fff; border: 2px solid var(--border); border-radius: 15px; outline: none; }
        /* 统一按钮样式：进入系统 + 返回 */
        .btn-submit, .btn-back { 
            width: 100%; 
            padding: 22px; 
            font-size: 24px; 
            font-weight: 700; 
            background: #fff; /* 白底色 */
            color: var(--primary); /* 蓝色文字 */
            border: 2px solid var(--primary); /* 蓝色边框 */
            border-radius: 15px; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.3s ease;
        }
        .btn-submit:hover, .btn-back:hover {
            background: var(--primary);
            color: #fff;
        }
        .btn-voice { width: 100%; padding: 18px; font-size: 20px; background: #fff; color: var(--primary); border: 2px dashed var(--primary); border-radius: 15px; cursor: pointer; font-weight: 600; margin: 0 auto 40px; display: block; }
    </style>
</head>
<body>
    <div class="glass">
        <h1>个人健康配置</h1>
        <p class="subtitle">请输入您的健康数据，方便系统精准分析</p>
        <button class="btn-voice" onclick="playVoice()">🔊 播放操作指引</button>
        <form id="userForm">
            <div class="form-group">
                <label>每日净碳水限制 (克)</label>
                <input type="number" step="0.1" name="daily_net_carbs" value="80.0" required>
            </div>
            <div class="form-group">
                <label>空腹血糖 (mmol/L)</label>
                <input type="number" step="0.1" name="fasting_sugar" value="6.5" required>
            </div>
            <button type="button" class="btn-submit" onclick="submitForm()">进入系统</button>
            <!-- 新增返回按钮 -->
            <button type="button" class="btn-back" onclick="goBack()">返回</button>
        </form>
    </div>

    <script>
        // 自动播放语音
        window.onload = function() {
            playVoice();
        };

        function playVoice(){
            const v = new SpeechSynthesisUtterance();
            v.text = "请输入您的每日净碳水限制和空腹血糖数值，填写完成后点击进入系统按钮，即可进入AI饮食识别终端。";
            v.lang = "zh-CN"; v.rate = 0.9;
            window.speechSynthesis.speak(v);
        }
        
        function submitForm(){
            const btn = document.querySelector('.btn-submit');
            btn.innerText = "正在进入..."; btn.disabled = true;
            setTimeout(()=>window.location.href="/Diabetes_detect_analyse", 1200);
        }


        function goBack() {
            const v = new SpeechSynthesisUtterance();
            v.text = "返回健康类别选择页面";
            v.lang = "zh-CN"; v.rate = 0.9;
            window.speechSynthesis.speak(v);
            setTimeout(() => window.location.href = "/DCSI", 800);
        }
    </script>
</body>
</html>
