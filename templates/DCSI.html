<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康类别选择 | AI饮食终端</title>
    <style>
        :root {
            --primary: #165DFF;
            --accent: #FFC107;
            --text-main: #333333;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --border: rgba(22, 93, 255, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "微软雅黑", sans-serif; }
        body {
            background: linear-gradient(135deg, rgb(239,150,166), rgb(195,210,162), rgb(102,194,140));
            color: var(--text-main);
            font-size: 18px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass {
            background: var(--panel-bg);
            border: 2px solid var(--border);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(22, 93, 255, 0.1);
        }
        .page-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: 12px;
        }
        .btn-voice {
            width: 100%;
            max-width: 300px;
            padding: 18px;
            font-size: 20px;
            background: #fff;
            color: var(--primary);
            border: 2px dashed var(--primary);
            border-radius: 15px;
            cursor: pointer;
            margin: 0 auto 30px;
            display: block;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }
        .category-card {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .category-card.active {
            background: #d1e7ff;
            border-color: var(--primary);
            transform: scale(1.03);
        }
        .category-card:hover:not(.active) {
            background: #f5f5f5;
        }
        .category-icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: var(--primary);
        }
        .btn-confirm {
            width: 100%;
            padding: 22px;
            font-size: 24px;
            font-weight: 700;
            background: #cccccc;
            color: #666666;
            border: none;
            border-radius: 15px;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }
        .btn-confirm.enabled {
            background: var(--accent);
            color: var(--primary);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="glass">
        <h1 class="page-title">选择健康管理类别</h1>
        <button class="btn-voice" onclick="playGuideVoice()">🔊 语音提示</button>
        
        <div class="category-grid">
            <div class="category-card" onclick="selectCategory(this, '/Diabetes_information_input')">
                <div class="category-icon">🩸</div><div>糖尿病</div>
            </div>
            <div class="category-card" onclick="selectCategory(this, '/Hyperglycemia_information_input')">
                <div class="category-icon">📈</div><div>高血糖</div>
            </div>
            <div class="category-card" onclick="selectCategory(this, '/Hypertension_information_input')">
                <div class="category-icon">💓</div><div>高血压</div>
            </div>
            <div class="category-card" onclick="selectCategory(this, '/Hyperlipidemia_information_input')">
                <div class="category-icon">🧪</div><div>高血脂</div>
            </div>
        </div>

        <button class="btn-confirm" id="confirmBtn" disabled>确认进入</button>
    </div>

    <script>
        let targetPage = "";
        window.addEventListener('DOMContentLoaded', function() {
            playGuideVoice();
        });
        function playGuideVoice() {
            const u = new SpeechSynthesisUtterance();
            u.text = "请选择您的健康管理类别，选择后点击确认按钮进入系统";
            window.speechSynthesis.speak(u);
        }
        function selectCategory(el, page) {
            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            targetPage = page;
            const btn = document.getElementById('confirmBtn');
            btn.disabled = false;
            btn.classList.add('enabled');
        }
        document.getElementById('confirmBtn').onclick = function(){
            if(targetPage) window.location.href = targetPage;
        }
    </script>
</body>
</html>
